<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Trình diễn pháo hoa đón giao thừa — Chúc Mừng Năm Mới" />
  <title>Phao Hoa · Đón Giao Thừa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <div class="atmosphere" aria-hidden="true">
    <div class="horizon"></div>
    <div class="vignette"></div>
  </div>

  <main class="stage">
    <p class="eyebrow">Đêm giao thừa</p>
    <h1 class="brand" id="yearLabel">2027</h1>
    <p class="wish">Chúc Mừng Năm Mới</p>
    <p class="hint">Chạm vào bầu trời để phóng pháo hoa</p>

    <div class="countdown" id="countdown" aria-live="polite">
      <div class="unit"><span data-unit="days">00</span><small>ngày</small></div>
      <div class="unit"><span data-unit="hours">00</span><small>giờ</small></div>
      <div class="unit"><span data-unit="mins">00</span><small>phút</small></div>
      <div class="unit"><span data-unit="secs">00</span><small>giây</small></div>
    </div>
  </main>

  <footer class="footer">
    <button type="button" class="sound-btn" id="soundBtn" aria-pressed="false">
      Bật âm thanh
    </button>
  </footer>

  <script src="fireworks.js"></script>
</body>
</html>
